            pointer-events: none;
        }

        #loading {

            color: white; font-size: 22px; z-index: 20; text-align: center;
        }
        #progress-bar { width: 200px; height: 18px; background: #333; border: 1px solid #fff; margin: 12px auto 0; }

        #loading-error { display: none; margin-top: 8px; font-size: 14px; color: #ffaaaa; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            background: red; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 10; pointer-events: none;
        }

            }, undefined, () => handleTextureError(url, x, y, z, rotation));
        };

            textureLoader.load(fallbackUrl, texture => {
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(3, 3), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));

            });

        // ========== CAMÉRA & CONTROLES ==========
        camera.position.set(0, 2, 0);
        let yaw = Math.PI;
        let pitch = 0;
        const sensitivityMouse = 0.0025;
        const sensitivityTouch = 0.0045;

        function updateCamera() {
            camera.rotation.order = 'YXZ';
            camera.rotation.set(pitch, yaw, 0);
        }

        // === PC : Pointer Lock (souris) ===
        renderer.domElement.addEventListener('click', () => {
            renderer.domElement.requestPointerLock();
        });

        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === renderer.domElement) {
                yaw -= e.movementX * sensitivityMouse;
                pitch -= e.movementY * sensitivityMouse;
                pitch = Math.max(-1.5, Math.min(1.5, pitch));
                updateCamera();
            }
        });

        // === MOBILE : Regard au doigt (sur le canvas) ===
        let isLooking = false;
        let lastTouchX = 0, lastTouchY = 0;

        renderer.domElement.addEventListener('touchstart', e => {
            // On regarde seulement si on touche le canvas (pas un bouton)
            if (e.touches.length === 1 && !e.target.closest('.control-btn')) {
                isLooking = true;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            }
        }, { passive: false });

        renderer.domElement.addEventListener('touchmove', e => {
            if (!isLooking || e.touches.length !== 1) return;
            e.preventDefault();
            const touch = e.touches[0];
            const dx = touch.clientX - lastTouchX;
            const dy = touch.clientY - lastTouchY;
            yaw -= dx * sensitivityTouch;
            pitch -= dy * sensitivityTouch;
            pitch = Math.max(-1.5, Math.min(1.5, pitch));
            updateCamera();
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        }, { passive: false });

        // ========== ROCKETS ==========
        const rocketColors = [
            {hex:0xff0000}, {hex:0x0000ff}, {hex:0x00ff00},
            {hex:0xffff00}, {hex:0xffffff}, {hex:0x000000}, {hex:0xffa500}
        ];
        let currentColorIndex = 0;
        let rocketMaterial = new THREE.MeshBasicMaterial({ color: rocketColors[0].hex });
        let traceMaterial = new THREE.MeshBasicMaterial({ color: rocketColors[0].hex });

        function updateColors() {
            currentColorIndex = (currentColorIndex + 1) % rocketColors.length;
            const col = rocketColors[currentColorIndex].hex;
            rocketMaterial = new THREE.MeshBasicMaterial({ color: col });
            traceMaterial = new THREE.MeshBasicMaterial({ color: col });
            document.getElementById("color-btn").style.background = '#' + col.toString(16).padStart(6,'0');
        }

        const rocketGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.5, 12);
        const rockets = [];
        const rocketSpeed = 0.25;
        const raycaster = new THREE.Raycaster();
        let lastShotTime = 0;
        const fireRate = 80;
        let isFiring = false;

        function getDirection() {
            return new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        }

        function launchRocket() {
            const now = Date.now();
            if (now - lastShotTime < fireRate) return;
            lastShotTime = now;

            const rocket = new THREE.Mesh(rocketGeometry, rocketMaterial);
            rocket.position.copy(camera.position);
            const dir = getDirection();
            rocket.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
            scene.add(rocket);
            rockets.push({ mesh: rocket, direction: dir, distance: 0 });
        }

        function createTrace(point, normal) {
            const trace = new THREE.Mesh(new THREE.CircleGeometry(0.12, 12), traceMaterial);
            trace.position.copy(point).add(normal.clone().multiplyScalar(0.02));
            trace.lookAt(point.clone().add(normal));
            scene.add(trace);
        }

        // PC : clic gauche = tir, clic droit = couleur
        renderer.domElement.addEventListener('mousedown', e => {
            if (e.button === 0) isFiring = true;
            else if (e.button === 2) updateColors();
        });
        document.addEventListener('mouseup', e => {
            if (e.button === 0) isFiring = false;
        });
        document.addEventListener('contextmenu', e => e.preventDefault());

        // ========== MOUVEMENT ==========
        let moveForward = 0, moveBackward = 0, moveLeft = 0, moveRight = 0;
        let isJumping = false, velocityY = 0;
        const moveSpeed = 0.08;
        const jumpSpeed = 0.22;
        const gravity = 0.012;

        const keys = {};
        document.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === " " && !isJumping) {
                e.preventDefault();
                isJumping = true;
                velocityY = jumpSpeed;
            }
        });
        document.addEventListener('keyup', e => {
            keys[e.key.toLowerCase()] = false;
        });

        // Helper boutons (tactile + souris)
        function bindButton(id, onStart, onEnd) {
            const el = document.getElementById(id);
            if (!el) return;
            const start = (e) => { e.preventDefault(); e.stopPropagation(); onStart(); };
            const end = (e) => { e.preventDefault(); e.stopPropagation(); onEnd(); };
            el.addEventListener('touchstart', start, { passive: false });
            el.addEventListener('touchend', end, { passive: false });
            el.addEventListener('touchcancel', end, { passive: false });
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
        }

        bindButton("mf", () => moveForward = 1, () => moveForward = 0);
        bindButton("mb", () => moveBackward = 1, () => moveBackward = 0);
        bindButton("ml", () => moveLeft = 1, () => moveLeft = 0);
        bindButton("mr", () => moveRight = 1, () => moveRight = 0);

        bindButton("jump", () => {
            if (!isJumping) {
                isJumping = true;
                velocityY = jumpSpeed;
            }
        }, () => {});

        bindButton("rocket", () => { isFiring = true; }, () => { isFiring = false; });
        bindButton("color-btn", () => updateColors(), () => {});

        function constrainCamera() {
            camera.position.x = Math.max(-11, Math.min(18, camera.position.x));
            camera.position.z = Math.max(-5.7, Math.min(5.7, camera.position.z));
            if (camera.position.y < 2) {
                camera.position.y = 2;
                velocityY = 0;
                isJumping = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isFiring) launchRocket();

            // Update rockets
            for (let i = rockets.length - 1; i >= 0; i--) {
                const r = rockets[i];
                r.mesh.position.addScaledVector(r.direction, rocketSpeed);
                r.distance += rocketSpeed;

                raycaster.set(r.mesh.position, r.direction);
                const hits = raycaster.intersectObjects([...walls, ...inscriptionsMeshes]);
                if (hits.length > 0 && hits[0].distance < rocketSpeed + 0.25) {
                    createTrace(hits[0].point, hits[0].face.normal.clone().transformDirection(hits[0].object.matrixWorld));
                    scene.remove(r.mesh);
                    rockets.splice(i, 1);
                } else if (r.distance > 40) {
                    scene.remove(r.mesh);
                    rockets.splice(i, 1);
                }
            }

            // Mouvement
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            if (moveForward || keys['z'] || keys['arrowup'] || keys['w']) camera.position.addScaledVector(forward, moveSpeed);
            if (moveBackward || keys['s'] || keys['arrowdown']) camera.position.addScaledVector(forward, -moveSpeed);
            if (moveLeft || keys['q'] || keys['arrowleft'] || keys['a']) camera.position.addScaledVector(right, -moveSpeed);
            if (moveRight || keys['d'] || keys['arrowright']) camera.position.addScaledVector(right, moveSpeed);

            if (isJumping) {
                camera.position.y += velocityY;
                velocityY -= gravity;
            }
            if (camera.position.y <= 2.01) {
                camera.position.y = 2;
                velocityY = 0;
                isJumping = false;
            }

            constrainCamera();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Empêche le scroll / zoom sur mobile
        document.addEventListener('touchmove', e => {
            if (e.target === renderer.domElement || e.target.closest('.control-btn')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
